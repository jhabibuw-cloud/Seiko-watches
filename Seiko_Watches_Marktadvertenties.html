<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>Seiko Watches</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071019;color:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh}.head{padding:22px 18px 12px}.brand{font-size:25px;font-weight:900;letter-spacing:2px}.gold{color:#e8c77e}.sub,.muted{color:#91a0aa;font-size:12px}.search{margin:0 16px;background:#111e29;border:1px solid #293946;border-radius:13px;padding:13px;color:white;width:calc(100% - 32px);outline:none}.chips{display:flex;gap:7px;overflow:auto;padding:10px 16px 0}.chip{white-space:nowrap;background:transparent;border:1px solid #344452;color:#d8e0e5;border-radius:20px;padding:8px 12px}.chip.on{background:#e8c77e;color:#10151a;border-color:#e8c77e}.tabs{display:flex;gap:25px;padding:18px;border-bottom:1px solid #1b2a36}.tab{background:none;border:0;color:#87949e;padding:0 0 7px}.tab.on{color:#e8c77e;border-bottom:2px solid #e8c77e}.list{padding:14px}.item{display:flex;gap:11px;align-items:center;background:#101c26;border:1px solid #233440;border-radius:15px;padding:12px;margin-bottom:10px}.thumb{width:62px;height:70px;border-radius:12px;background:#192936;display:grid;place-items:center;font-size:40px;color:#e8c77e}.name{font-weight:750;font-size:14px}.meta{font-size:11px;color:#8d9ba5;margin-top:4px}.price{font-size:12px;color:#e8c77e;font-weight:800;margin-top:7px}.heart{background:none;border:0;color:#e8c77e;font-size:23px}.footer{text-align:center;color:#64727d;font-size:9px;padding:8px 15px 20px}.detail{padding:16px}.back{background:none;border:0;color:#e8c77e;padding:0 0 15px}.hero{background:#101d28;border-radius:18px;padding:28px;text-align:center}.watch{font-size:70px;color:#e8c77e}.kicker{font-size:10px;letter-spacing:2px;color:#e8c77e;margin-top:7px}.title{font-size:23px;font-weight:800;margin-top:7px}.card{background:#101c26;border-radius:16px;padding:17px;margin-top:14px}.section{font-size:17px;font-weight:800;margin:5px 0 10px}.prow,.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #263540}.big{color:#e8c77e;font-size:21px;font-weight:900;margin-top:3px}.badge{font-size:9px;color:#e8c77e;border:1px solid #e8c77e;border-radius:10px;padding:4px 7px}.note{color:#7f8c95;font-size:10px;line-height:16px;margin-top:10px}.goldbtn,.sourcebtn{width:100%;border-radius:25px;padding:13px;margin-top:12px}.goldbtn{background:#e8c77e;border:0;color:#111820;font-weight:800}.sourcebtn{background:transparent;border:1px solid #40515d;color:#dce2e6;font-weight:700}.empty{text-align:center;color:#aab4bb;padding:30px}
</style></head><body><div class="app" id="app"></div>
<script>
const W=[
{id:"SPB143J1",n:"Seiko Prospex SPB143",y:2020,t:"Automatisch",c:"Prospex",p:1400,m:755,e:"Modern",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"SRPB41J1",n:"Seiko Presage Cocktail Time",y:2017,t:"Automatisch",c:"Presage",p:440,m:185,e:"Modern",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"Astron GPS",n:"Seiko Astron GPS Solar",y:2026,t:"Solar",c:"Astron",p:3200,m:246,e:"Modern",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"HCB001J1",n:"Seiko Presage Classic",y:2026,t:"Automatisch",c:"Presage",p:490,m:185,e:"Modern",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"6139-6002",n:"Seiko 6139 Chronograph",y:1972,t:"Automatisch",c:"Vintage",p:null,m:790,e:"Vintage",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"6105-8110",n:"Seiko 6105 Diver",y:1970,t:"Automatisch",c:"Vintage",p:null,m:1000,e:"Vintage",u:"https://www.chrono24.nl/seiko/index.htm"},
{id:"7548-7000",n:"Seiko 7548 Diver",y:1981,t:"Quartz",c:"Vintage",p:null,m:350,e:"Vintage",u:"https://www.chrono24.nl/seiko/index.htm"}];
let state={q:"",t:"Alle",e:"Alles",tab:"Catalogus",fav:JSON.parse(localStorage.getItem("fav")||"[]")};
const eur=n=>n==null?"—":"€"+n.toLocaleString("nl-NL");
function render(){
let A=W.filter(w=>(w.n+" "+w.id+" "+w.c).toLowerCase().includes(state.q.toLowerCase())&&(state.t=="Alle"||w.t==state.t)&&(state.e=="Alles"||w.e==state.e)&&(state.tab=="Catalogus"||state.fav.includes(w.id)));
document.getElementById("app").innerHTML=`<div class="head"><div class="brand">SEIKO <span class="gold">WATCHES</span></div><div class="sub">Catalogus + actuele marktprijzen</div></div>
<input class="search" placeholder="Zoek model of referentie" value="${state.q.replaceAll('"','&quot;')}" oninput="state.q=this.value;render()">
<div class="chips">${["Alle","Automatisch","Quartz","Solar"].map(x=>`<button class="chip ${state.t==x?"on":""}" onclick="state.t='${x}';render()">${x}</button>`).join("")}</div>
<div class="chips">${["Alles","Vintage","Modern"].map(x=>`<button class="chip ${state.e==x?"on":""}" onclick="state.e='${x}';render()">${x}</button>`).join("")}</div>
<div class="tabs"><button class="tab ${state.tab=="Catalogus"?"on":""}" onclick="state.tab='Catalogus';render()">Catalogus</button><button class="tab ${state.tab=="Favorieten"?"on":""}" onclick="state.tab='Favorieten';render()">♡ Favorieten</button></div>
<div class="list">${A.map(w=>`<div class="item" onclick="detail('${w.id}')"><div class="thumb">◉</div><div style="flex:1"><div class="name">${w.n}</div><div class="meta">${w.id} · ${w.y} · ${w.t}</div><div class="price">Markt vanaf ${eur(w.m)}</div>${w.p?`<div class="meta">Officieel ${eur(w.p)}</div>`:""}</div><button class="heart" onclick="event.stopPropagation();toggle('${w.id}')">${state.fav.includes(w.id)?"♥":"♡"}</button></div>`).join("")||'<div class="empty">Geen modellen gevonden.</div>'}</div><div class="footer">Prijzen zijn indicatief en kunnen veranderen.</div>`;
}
function toggle(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!=id):[...state.fav,id];localStorage.setItem("fav",JSON.stringify(state.fav));render()}
function detail(id){let w=W.find(x=>x.id==id);document.getElementById("app").innerHTML=`<div class="detail"><button class="back" onclick="render()">‹ Terug</button><div class="hero"><div class="watch">◉</div><div class="kicker">${w.c.toUpperCase()} · ${w.y}</div><div class="title">${w.n}</div><div class="sub">${w.id}</div></div><div class="card"><div class="section">Prijsinformatie</div>${w.p?`<div class="prow"><div><div class="muted">Officiële prijs</div><div class="big">${eur(w.p)}</div></div><span class="badge">OFFICIEEL</span></div>`:""}<div class="prow"><div><div class="muted">Markt vanaf</div><div class="big">${eur(w.m)}</div></div><span class="badge">MARKT</span></div><div class="note">Marktprijzen zijn vanafprijzen uit advertenties en kunnen verschillen door staat, compleetheid, verkoper en verzending.</div><div class="section" style="margin-top:20px">Specificaties</div>${[["Uurwerk",w.t],["Collectie",w.c],["Jaar",w.y],["Referentie",w.id]].map(r=>`<div class="row"><span class="muted">${r[0]}</span><span>${r[1]}</span></div>`).join("")}<button class="goldbtn" onclick="toggle('${w.id}')">${state.fav.includes(w.id)?"♥ Verwijder uit favorieten":"♡ Bewaar als favoriet"}</button><a class="sourcebtn" href="https://www.chrono24.com/search/index.htm?query=Seiko" target="_blank" rel="noopener noreferrer">Bekijk marktadvertenties ↗</a></div></div>`}
render();
</script>
<section id="market-listings" style="padding:16px;margin:16px;border-radius:18px;background:#151515;color:#fff;">
<h2 style="margin:0 0 10px;">Marktadvertenties</h2>
<p style="opacity:.75;margin-top:0;">Bekijk actuele advertenties per Seiko-collectie.</p>
<div style="display:grid;gap:12px;">
<article style="padding:14px;border:1px solid #333;border-radius:14px;"><strong>Seiko 5 Automatic</strong><br><span>Zoek actuele advertenties</span><br><a href="https://www.chrono24.com/search/index.htm?query=Seiko%205%20Automatic" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:8px;color:#d8b15a;">Bekijk advertenties ↗</a></article>
<article style="padding:14px;border:1px solid #333;border-radius:14px;"><strong>Seiko Presage</strong><br><span>Zoek actuele advertenties</span><br><a href="https://www.chrono24.com/search/index.htm?query=Seiko%20Presage" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:8px;color:#d8b15a;">Bekijk advertenties ↗</a></article>
<article style="padding:14px;border:1px solid #333;border-radius:14px;"><strong>Seiko Prospex</strong><br><span>Zoek actuele advertenties</span><br><a href="https://www.chrono24.com/search/index.htm?query=Seiko%20Prospex" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:8px;color:#d8b15a;">Bekijk advertenties ↗</a></article>
</div></section>

</body></html>
